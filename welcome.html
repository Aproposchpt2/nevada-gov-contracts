<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nevada State Government Contracts Center — Welcome</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Cormorant:ital,wght@1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F2A6A;--ink-2:#163472;--white:#FFFFFF;--silver:#C3D0E8;--line:rgba(255,255,255,.12);--line-2:rgba(255,255,255,.22);--gold-bright:#EEF3FF;--green:#6EE7A8;--red:#F87171;--disp:'Bodoni Moda',Georgia,serif;--subdisp:'Cormorant',Georgia,serif;--body:'Jost',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:rgba(255,255,255,.72);font-weight:300;line-height:1.7;min-height:100vh;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px}
a{color:inherit;text-decoration:none}
.card{position:relative;z-index:1;width:min(440px,100%);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:clamp(28px,5vw,40px)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.brand .mark{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-family:var(--body);font-weight:600;font-size:.82rem;background:var(--white);color:var(--ink)}
.brand .bn{font-family:var(--disp);font-size:1.18rem;color:var(--white)}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:10px}
h1{font-family:var(--disp);font-weight:400;font-size:1.8rem;color:var(--white);line-height:1.1;margin-bottom:8px}
h1 em{font-family:var(--subdisp);font-style:italic;color:rgba(255,255,255,.5)}
.sub{color:rgba(255,255,255,.55);font-size:.92rem;line-height:1.7;margin-bottom:22px}
label{display:block;font-size:.58rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);margin:0 0 7px}
input{width:100%;font-family:var(--body);font-size:.98rem;font-weight:300;color:#fff;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:4px;padding:.82rem .9rem;margin-bottom:16px;transition:border-color .2s}
input:focus{outline:none;border-color:rgba(255,255,255,.5)}
.btn{width:100%;background:var(--white);color:var(--ink);font-family:var(--body);font-weight:600;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;border:none;border-radius:4px;padding:.92rem;cursor:pointer;transition:background .25s}
.btn:hover{background:var(--gold-bright)}
.btn:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;text-align:center;font-size:.86rem;min-height:18px}
.msg.err{color:var(--red)}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark">NV</span><span class="bn">Nevada State Government Contracts Center</span></div>

  <div id="loadingStep" style="display:none">
    <div class="eyebrow">Welcome</div>
    <h1>Setting up <em>your dashboard.</em></h1>
    <p class="sub">One moment while we get things ready…</p>
  </div>

  <div id="formStep" style="display:none">
    <div class="eyebrow">Welcome</div>
    <h1>Let's find <em>your matches.</em></h1>
    <p class="sub">Free for every Nevada business — no account, no trial code required. Tell us who you are to get started.</p>
    <label for="name">Your name</label>
    <input id="name" type="text" autocomplete="name" placeholder="Jane Smith">
    <label for="business">Business name</label>
    <input id="business" type="text" autocomplete="organization" placeholder="Acme Contracting LLC">
    <button class="btn" id="startBtn">Build my dashboard →</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);

function mintSession(name, business, email){
  const token = 'local_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : (Date.now().toString(36)+Math.random().toString(36).slice(2)));
  const profile = { name: name || '', business_name: business || '' };
  if(email) profile.email = email;
  localStorage.setItem('stategen_session', token);
  localStorage.setItem('stategen_profile', JSON.stringify(profile));
  location.href = '/dashboard.html';
}

const params = new URLSearchParams(location.search);
const qName = (params.get('name')||'').trim();
const qBusiness = (params.get('business')||'').trim();
const qEmail = (params.get('email')||'').trim();

if(qName && qBusiness){
  $('loadingStep').style.display='block';
  mintSession(qName, qBusiness, qEmail);
} else {
  $('formStep').style.display='block';
  if(qName) $('name').value = qName;
  if(qBusiness) $('business').value = qBusiness;
  $('startBtn').addEventListener('click', ()=>{
    const m=$('msg'); m.className='msg'; m.textContent='';
    const name=$('name').value.trim(), business=$('business').value.trim();
    if(!name){ m.className='msg err'; m.textContent='Please enter your name.'; return; }
    if(business.length<2){ m.className='msg err'; m.textContent='Please enter your business name.'; return; }
    const b=$('startBtn'); b.disabled=true; b.textContent='Building…';
    mintSession(name, business, qEmail);
  });
  ['name','business'].forEach(id=>$(id).addEventListener('keydown', e=>{ if(e.key==='Enter') $('startBtn').click(); }));
}
</script>
</body>
</html>
